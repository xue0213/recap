tree:
  - id: N01
    type: question
    title: "Reproduce OFA A/B/C baselines under the RECAP protocol"
    provenance: user
    timestamp: "2026-07-26T17:07+08:00"
    description: >
      Complete equivalent reproductions of the baselines required by
      RECAP-OFA Settings A, B, and C.
    children:
      - id: N02
        type: experiment
        title: "Lock and gate four official baseline adapters"
        provenance: ai-executed
        timestamp: "2026-07-26T17:07+08:00"
        result: >
          Pinned upstreams, verified datasets, locked 24 runs and 156
          evaluations, and passed method-specific smoke and equivalence gates.
        evidence: [E02]
        children:
          - id: N03
            type: dead_end
            title: "CUDA sparse UNPrompt reload was nondeterministic"
            provenance: ai-executed
            timestamp: "2026-07-26T17:07+08:00"
            hypothesis: >
              Repeated frozen target inference would reproduce checkpoint
              scores within the locked tolerance on CUDA.
            failure_mode: >
              Sparse CUDA reduction changed min-max scores by up to 1.36e-3.
            lesson: >
              Last-bit sparse reduction differences must be controlled in the
              frozen target inference backend.
            children:
              - id: N04
                type: experiment
                title: "Deterministic UNPrompt target inference recovery"
                provenance: ai-executed
                timestamp: "2026-07-26T17:07+08:00"
                result: >
                  CPU sparse target aggregation matched the dense expression,
                  repeated bitwise, and gave zero reload difference on all
                  eight Setting-A smoke targets.
                evidence: [C04, E02]
                children:
                  - id: N05
                    type: experiment
                    title: "Execute the amended formal manifest"
                    provenance: ai-executed
                    timestamp: "2026-07-26T17:07+08:00"
                    result: >
                      Completed 24/24 runs and 156/156 evaluations with one
                      shared amended protocol hash.
                    evidence: [C01, E01]
                    children:
                      - id: N06
                        type: dead_end
                        title: "Initial independent audit reported 145 mismatches"
                        provenance: ai-executed
                        timestamp: "2026-07-26T17:07+08:00"
                        hypothesis: >
                          A method-agnostic exact-key and global-dataset-hash
                          schema would validate every output.
                        failure_mode: >
                          Auxiliary method score arrays, IA field naming, and
                          per-run source-target hash scope invalidated those
                          auditor assumptions.
                        lesson: >
                          Audit required invariants while explicitly allowing
                          recorded method-specific auxiliary fields.
                        children:
                          - id: N07
                            type: experiment
                            title: "Independent artifact and metric validation"
                            provenance: ai-executed
                            timestamp: "2026-07-26T17:07+08:00"
                            result: >
                              Verified 24 checkpoints, 156 score files, 156
                              recomputed metrics, and 462 label events with
                              zero remaining problems.
                            evidence: [C01, E01]
                            children:
                              - id: N08
                                type: experiment
                                title: "Compare baseline and RECAP macros"
                                provenance: ai-executed
                                timestamp: "2026-07-26T17:07+08:00"
                                result: >
                                  ARC and IA lead A/B. RECAP has higher C
                                  dataset-macro AUROC but slightly lower AUPRC,
                                  and exceeds UNPrompt/AnomalyGFM-ZS in A.
                                evidence: [C02, C03, E01]
                                children:
                                  - id: N09
                                    type: decision
                                    title: "Require all four baselines in B/C"
                                    provenance: user-revised
                                    timestamp: "2026-07-26T18:01+08:00"
                                    choice: >
                                      Add UNPrompt and AnomalyGFM-ZS to
                                      Settings B and C.
                                    alternatives:
                                      - "Retain the original ARC/IA-only B/C scope"
                                    evidence: >
                                      The user explicitly corrected the
                                      completed protocol scope.
                                    children:
                                      - id: N10
                                        type: experiment
                                        title: "Gate isolated B/C supplement"
                                        provenance: ai-executed
                                        timestamp: "2026-07-26T18:01+08:00"
                                        result: >
                                          Ten tests and four method-setting
                                          smokes passed with 20/20 finite
                                          frozen scores and zero invalid label
                                          events.
                                        evidence: [E03]
                                        children:
                                          - id: N11
                                            type: experiment
                                            title: "Run B/C baseline supplement"
                                            provenance: ai-executed
                                            timestamp: "2026-07-26T18:01+08:00"
                                            result: >
                                              Completed 12/12 runs and 60/60
                                              evaluations. AnomalyGFM source
                                              calibration selected weights
                                              2.0 for B and 4.0 for C.
                                            evidence: [C05, E03]
                                            children:
                                              - id: N12
                                                type: experiment
                                                title: "Audit complete four-baseline comparison"
                                                provenance: ai-executed
                                                timestamp: "2026-07-26T18:01+08:00"
                                                result: >
                                                  Verified all supplementary
                                                  checkpoints, scores, metrics,
                                                  label events, and calibration
                                                  locks. RECAP exceeds both
                                                  added baselines in B/C.
                                                evidence: [C05, C06, E03]

  - id: N13
    type: question
    title: "Reproduce eight OFO baselines on all twelve RECAP datasets"
    provenance: user
    timestamp: "2026-07-26T20:10+08:00"
    description: >
      Run GCN, GAT, BWGNN, XGBGraph, DOMINANT, AnomalyDAE, CoLA, and ADA-GAD
      independently on every RECAP-OFO dataset, including Questions, with
      three seeds, periodic supervision, and completion-level validation.
    children:
      - id: N14
        type: experiment
        title: "Lock and gate the 288-run OFO protocol"
        provenance: ai-executed
        timestamp: "2026-07-26T20:10+08:00"
        result: >
          Locked supervision rights, evaluation populations, method settings,
          scalable structure adaptations, and persistence rules. Eight
          equivalence tests, all preprocessing/split gates, and 16
          Cora/Questions method smokes passed.
        evidence: [E04]
        children:
          - id: N15
            type: dead_end
            title: "XGBoost sklearn-wrapper persistence was incompatible"
            provenance: ai-executed
            timestamp: "2026-07-26T20:10+08:00"
            hypothesis: >
              The sklearn wrapper would persist and reload formal XGBGraph
              scores under XGBoost 3.0.2 and scikit-learn 1.8.
            failure_mode: >
              Wrapper persistence failed during the pre-formal smoke gate.
            lesson: >
              Use XGBoost's native Booster JSON persistence without changing
              features, trees, predictions, or the experimental objective.
            children:
              - id: N16
                type: experiment
                title: "Verify native XGBoost Booster reload"
                provenance: ai-executed
                timestamp: "2026-07-26T20:10+08:00"
                result: >
                  Native JSON persistence reproduced smoke and all 36 formal
                  XGBGraph score vectors with zero reload difference.
                evidence: [E04]

          - id: N17
            type: dead_end
            title: "Fixed absolute reload tolerance rejected CUDA last bits"
            provenance: ai-executed
            timestamp: "2026-07-26T20:10+08:00"
            hypothesis: >
              Every AnomalyDAE score vector would reload within a fixed
              1e-5 absolute threshold.
            failure_mode: >
              Questions reconstruction scores amplified harmless CUDA scatter
              last-bit differences during the smoke gate.
            lesson: >
              Lock a scale-aware threshold before formal results and retain
              exact metric recomputation as the independent acceptance check.
            children:
              - id: N18
                type: experiment
                title: "Gate scale-aware checkpoint reload threshold"
                provenance: ai-executed
                timestamp: "2026-07-26T20:10+08:00"
                result: >
                  The pre-result threshold passed all method smokes and all 288
                  formal reloads; the largest difference was 1.75e-4.
                evidence: [E04, H07]

          - id: N19
            type: experiment
            title: "Execute and block-audit all OFO runs"
            also_depends_on: [N16, N18]
            provenance: ai-executed
            timestamp: "2026-07-26T20:10+08:00"
            result: >
              Completed 288/288 runs method by method, auditing every 12-run
              seed block and reflecting after every 36-run method. Questions
              was retained throughout; no weak result triggered tuning.
            evidence: [C07, E04]
            children:
              - id: N20
                type: experiment
                title: "Independently audit and aggregate the complete manifest"
                provenance: ai-executed
                timestamp: "2026-07-26T20:10+08:00"
                result: >
                  Recomputed all 576 metrics and verified all models, data,
                  score/mask hashes, label events, reloads, dataset/domain
                  macros, timing, and resources. XGBGraph leads the supervised
                  test-split group; RECAP leads the full-graph unsupervised
                  group.
                evidence: [C07, C08, C09, E04]
